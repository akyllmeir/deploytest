<!doctype html>
<html lang="{{ site_lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ T.register }} — {{ T.site_name }}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="/static/css/styles.css" rel="stylesheet">
</head>

<body>

<div class="auth-wrap">
  <div class="auth-card">

    <div class="text-center mb-4">

      <div class="auth-logo">
        <i class="bi bi-hospital-fill"></i>
      </div>

      <h1 class="auth-title">
        {{ T.site_name }}
      </h1>

      <p class="auth-subtitle">
        {{ T.register }}
      </p>

    </div>

    <div class="auth-tabs">

      <a href="{% url 'login' %}"
         class="auth-tab">
        {{ T.login }}
      </a>

      <a href="{% url 'register' %}"
         class="auth-tab active">
        {{ T.register }}
      </a>

    </div>

    <form method="post">

      {% csrf_token %}

      {% if form.errors %}
        <div class="alert alert-danger">
          {{ form.errors }}
        </div>
      {% endif %}

      <div class="mb-3">
        <label class="form-label">
          {{ T.full_name }}
        </label>

        {{ form.full_name }}
      </div>

      <div class="mb-3">
        <label class="form-label">
          {{ T.email }}
        </label>

        {{ form.email }}
      </div>

      <div class="mb-3">
        <label class="form-label">
          {{ T.password }}
        </label>

        {{ form.password1 }}
      </div>

      <div class="mb-4">
        <label class="form-label">
          {{ T.password_confirm }}
        </label>

        {{ form.password2 }}
      </div>

      <button type="submit"
              class="btn btn-success w-100 py-3 auth-submit">

        {{ T.register }}

      </button>

    </form>

    <div class="text-center mt-4">

      <div class="auth-lang">

        <a href="{% url 'switch_language' 'ru' %}"
           class="auth-lang-link {% if site_lang == 'ru' %}active{% endif %}">
          RU
        </a>

        <span>|</span>

        <a href="{% url 'switch_language' 'kz' %}"
           class="auth-lang-link {% if site_lang == 'kz' %}active{% endif %}">
          KZ
        </a>

      </div>

    </div>

  </div>
</div>

</body>
</html>
